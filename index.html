    attention.length?`<span class="timeline-notice attention"><i aria-hidden="true"></i>${t('attention')}: ${[...new Set(attention.map(x=>x.c))].map(c=>`<a href="#${c.anchor}" data-view-company>${esc(c.company.ticker)}</a>`).join(' · ')}</span>`:'',
    unknown.length?`<span class="timeline-notice">${t('unknown')}: ${unknown.map(c=>`<a href="#${c.anchor}" data-view-company>${esc(c.company.ticker)}</a>`).join(' · ')}</span>`:''
  ].join('');
  notes.hidden=!notes.textContent;
  renderSelected();wireLogos();
}
function layoutTimeline(){
  const timeline=$('#timeline'), width=timeline.clientWidth;
  if(!width||!timeline.querySelector('.timeline-events'))return;
  const mobile=matchMedia('(max-width:600px)').matches, cardWidth=164, inset=12;
  const lanes=[];
  timeline.querySelectorAll('.timeline-item').forEach(item=>{
    const x=inset+(width-inset*2)*Number(item.dataset.days)/Number(timeline.dataset.horizon);
    const left=Math.max(0,Math.min(width-cardWidth,x-20));
    let lane=lanes.findIndex(right=>left>=right+18);
    if(lane<0)lane=lanes.length;
    lanes[lane]=left+cardWidth;
    item.style.setProperty('--x',`${x}px`);
    item.style.setProperty('--left',`${left}px`);
    item.style.setProperty('--stem',`${32+lane*112}px`);
  });
  timeline.style.setProperty('--timeline-height',`${mobile?0:72+lanes.length*112}px`);
}
function renderSelected(){
  const panel=$('#selected-event'), rows=events().filter(x=>x.e.date===selected);
  if(!rows.length)selected=null;
  panel.hidden=!selected;
  document.querySelectorAll('.timeline-event').forEach(b=>b.setAttribute('aria-expanded',String(selected===b.dataset.date)));
  if(!selected){panel.innerHTML='';return;}
  panel.innerHTML=rows.map(({c,e,s})=>`<div class="event-detail"><div><strong>${esc(c.company.ticker)} · ${fmt(e.date)}</strong> ${badge(s)}<p>${esc(e.period)} · ${confidence(e)} · ${esc(e.timezone||'UTC')}</p><p>${esc(note(s)||t('timeUnknown'))}</p></div><a href="#${c.anchor}" data-view-company>${t('viewCompany')} ↗</a></div>`).join('');
}
function renderCards(){const q=$('#search').value.trim().toLowerCase();const list=entries.map(c=>({c,state:S.companyState(c)})).filter(({c,state})=>(filter!=='attention'||state.attention)&&`${c.company.name} ${c.company.ticker} ${(c.ticker_aliases||[]).join(' ')}`.toLowerCase().includes(q)).sort((a,b)=>Number(b.state.attention)-Number(a.state.attention)||(a.state.next?.event.date||'9999').localeCompare(b.state.next?.event.date||'9999')||a.c.company.ticker.localeCompare(b.c.company.ticker));$('#cards').innerHTML=list.map(({c,state})=>{const s=state.primary,e=s.event||{},card=c.card||{},url=reportUrl(c),report=c.reports.find(r=>r.report_id===c.latest_report_id)||{};const delta=e.date?S.days(e.date,new Date(),e.timezone||'UTC'):null,subtitle=tx(card.business),risk=tx(card.risk);return `<article id="${c.anchor}" class="card ${url?'linked':''} ${state.attention?'attention':''}"><div class="card-main"><div class="card-heading">${logo(c)}<div><h3>${url?`<a class="card-link" href="${url}" aria-label="${esc(t('read')+': '+c.company.name)}">${esc(c.company.ticker)}</a>`:esc(c.company.ticker)}</h3><div class="company-name">${esc(c.company.name)} · ${esc(c.company.exchange)}</div></div></div><div class="status-row">${badge(s)}</div>${subtitle?`<p class="card-context">${esc(subtitle)}</p>`:''}<p class="card-summary">${esc(tx(card.summary))}</p>${risk?`<p class="card-context"><strong>${lang==='ro'?'De urmărit':'Watch for'}:</strong> ${esc(risk)}</p>`:''}<div class="earnings-box"><div><div class="label">${state.attention?t('pendingEarnings'):t('nextEarnings')}</div><div class="date-value">${fmt(e.date)}</div><div class="date-meta">${confidence(e)}${e.period?' · '+esc(e.period):''}</div></div><div class="countdown">${delta===null?'—':Math.abs(delta)}<span>${delta!==null&&delta<0?t('ago'):t('days')}</span></div></div>${note(s)?`<p class="review-note">${esc(note(s))}</p>`:''}${state.attention&&state.next&&state.next.event.period!==e.period?`<p class="date-meta">${t('nextAlso')}: ${fmt(state.next.event.date)} · ${confidence(state.next.event)}</p>`:''}</div><div class="card-footer"><div class="card-actions">${url?'':`<button class="primary" data-prompt="${esc(c.id)}">${t('continue')}</button>`}<button class="text-button" data-prompt="${esc(c.id)}">${state.attention?t('reviewAction'):t('prepare')} ↗</button></div><p class="meta">${t('lastAnalysis')} · ${fmt(c.latest_cutoff)} · ${c.watch_count??0} ${t('checks')}</p><details><summary>${t('dateSource')}</summary><p>${t('scheduleChecked')}: ${fmt(e.checked_at)} · ${esc(e.timezone||'UTC')}</p><p>${esc(tx(e.basis))}</p>${safeUrl(e.source_url)?`<p><a href="${safeUrl(e.source_url)}" target="_blank" rel="noopener">${t('source')}</a>${safeUrl(e.issuer_calendar_url)?` · <a href="${safeUrl(e.issuer_calendar_url)}" target="_blank" rel="noopener">${t('issuer')}</a>`:''}</p>`:''}${url?`<p><a href="${url}" download="${esc(report.html_filename||c.company.ticker+'-report.html')}">${t('download')}</a></p>`:`<p>${t('reportMissing')} ${esc(report.html_filename||'')}</p>`}</details></div></article>`}).join('')||`<div class="empty">${t('none')}</div>`;$('#cards').querySelectorAll('[data-prompt]').forEach(b=>b.onclick=()=>showPrompt(entries.find(c=>c.id===b.dataset.prompt)));wireLogos()}
function showPrompt(c){const p=S.companyState(c).primary,e=p.event||{},rid=e.baseline_report_id||c.latest_report_id;const repo=data.storage?.repository;const locationEn=repo?`from https://github.com/${repo}: stock-analysis-registry.json and ${c.archive_path}. Commit the report, archive, registry and index.html to that repository. Do not publish on ChatGPT Sites`:`stock-analysis-registry.json and the company archive ${c.archive_filename} (Library ID: ${c.archive_file_id})`;const locationRo=repo?`din https://github.com/${repo}: stock-analysis-registry.json și ${c.archive_path}. Salvează raportul, arhiva, registrul și index.html în acel repository. Nu publica pe ChatGPT Sites`:`stock-analysis-registry.json și arhiva ${c.archive_filename} (Library ID: ${c.archive_file_id})`;const en=`Use the Stock Analysis skill to check ${c.company.name} (${c.company.exchange}:${c.company.ticker}), ${e.period||'the next earnings release'}. Verify issuer ${c.company.issuer_id} and security ${c.company.security_id}. Retrieve ${locationEn}. Verify publication first. Use saved baseline ${rid}; preserve every original watch ID and criterion. If published, compare the actual results with the saved watchlist, save the linked update, and refresh the same company index. If unpublished, keep the review pending and update only the schedule with a source. Do not reconstruct the original expectations from memory.`;const ro=`Folosește skill-ul Stock Analysis pentru ${c.company.name} (${c.company.exchange}:${c.company.ticker}), ${e.period||'următoarea raportare'}. Verifică emitentul ${c.company.issuer_id} și instrumentul ${c.company.security_id}. Încarcă ${locationRo}. Verifică mai întâi publicarea. Folosește analiza de bază ${rid} și păstrează toate criteriile și ID-urile originale. Dacă rezultatele sunt publicate, compară-le cu lista salvată, salvează actualizarea și reîmprospătează același index. Dacă nu, păstrează verificarea în așteptare și actualizează doar calendarul cu o sursă. Nu reconstrui așteptările din memorie.`;$('#prompt-text').value=lang==='ro'?ro:en;$('#copy-status').textContent='';$('#prompt-dialog').showModal()}
function refresh(){document.documentElement.lang=lang;document.querySelectorAll('[data-t]').forEach(e=>e.textContent=t(e.dataset.t));$('#language').textContent=lang==='en'?'RO':'EN';$('#language').setAttribute('aria-label',lang==='en'?'Switch to Romanian':'Schimbă în engleză');$('#search').placeholder=t('search');$('#search').setAttribute('aria-label',t('search'));$('#theme').setAttribute('aria-label',lang==='en'?'Switch theme':'Schimbă tema');$('#saved-at').textContent=t('saved')+' · '+fmt(data.generated_at);renderStats();renderTimeline();renderCards()}
$('#language').onclick=()=>{lang=lang==='en'?'ro':'en';try{localStorage.setItem('stock-index-lang',lang)}catch{}refresh()};$('#theme').onclick=()=>{const theme=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=theme;try{localStorage.setItem('stock-index-theme',theme)}catch{}};$('#search').oninput=renderCards;document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));renderCards()});$('#close-dialog').onclick=()=>$('#prompt-dialog').close();$('#copy-prompt').onclick=async()=>{try{await navigator.clipboard.writeText($('#prompt-text').value);$('#copy-status').textContent=t('copied')}catch{$('#prompt-text').focus();$('#prompt-text').select();$('#copy-status').textContent=t('copyFailed')}};$('#export').onclick=()=>{const copy={...data};delete copy.embedded_reports;const url=URL.createObjectURL(new Blob([JSON.stringify(copy,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download='stock-analysis-registry.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
function tick(){const next=JSON.stringify(entries.map(c=>S.companyState(c)));if(next!==signature){signature=next;refresh()}}
document.querySelector('.schedule').addEventListener('click',event=>{
  if(!event.target.closest('[data-view-company]'))return;
  $('#search').value='';filter='all';
  document.querySelectorAll('[data-filter]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.filter==='all')));
  renderCards();
});
document.addEventListener('keydown',event=>{if(event.key==='Escape'&&selected){selected=null;renderSelected()}});
new ResizeObserver(layoutTimeline).observe($('#timeline'));
document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick()});setInterval(tick,60000);tick();
})();
</script>
