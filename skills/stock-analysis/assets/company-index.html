<!doctype html>
<html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="dark light"><title>Company index · Stock Analysis</title><style>/*INDEX_CSS*/</style></head>
<body>
<div class="shell">
<header class="top"><div class="brand"><span class="brand-icon" aria-hidden="true">◒</span> <span>STOCK ANALYSIS <span class="version">/ 03</span></span></div><div class="settings"><button id="language" aria-label="Switch to Romanian">RO</button><button id="theme" aria-label="Switch theme">◐</button></div></header>
<main>
<h1 class="sr-only" data-t="title">Company index</h1>
<div id="stats" class="stats"></div>
<div class="index-layout">
<section aria-labelledby="companies-title"><div class="section-head companies-heading"><h2 id="companies-title" data-t="companies">Companies</h2><label class="search"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="Find a company or ticker" aria-label="Find a company or ticker"></label></div><div class="filters"><button data-filter="all" aria-pressed="true" data-t="all">All companies</button><button data-filter="attention" aria-pressed="false" data-t="attention">Needs attention</button></div><div id="cards" class="cards"></div></section>
<aside class="schedule" aria-labelledby="timeline-title">
<div class="section-head"><h2 id="timeline-title" data-t="timeline">Earnings ahead</h2><span id="timeline-range" class="timeline-range"></span></div>
<div id="timeline" class="timeline"></div>
<div id="timeline-notes" class="timeline-notes" hidden></div>
<div id="selected-event" class="selected-event" hidden></div>
</aside>
</div>
<footer><p data-t="foot">Countdowns update when this file is open. Research and earnings dates are refreshed when we run the skill.</p><div><span id="saved-at"></span><button id="export" class="text-button" data-t="export">Export index data ↓</button></div></footer>
</main></div>
<dialog id="prompt-dialog"><div class="dialog-head"><h2 data-t="continue">Continue the research</h2><button id="close-dialog" aria-label="Close">×</button></div><p data-t="promptHelp">Copy this into a new conversation to check the results against your saved watchlist.</p><textarea id="prompt-text" readonly aria-label="New conversation prompt"></textarea><button id="copy-prompt" class="primary" data-t="copy">Copy prompt</button><p id="copy-status" role="status"></p></dialog>
<noscript><p>Enable JavaScript to show the company cards, earnings timeline and live countdowns.</p></noscript>
<script id="index-data" type="application/json">"__INDEX_DATA__"</script><script>/*INDEX_LOGIC*/</script><script>/*INDEX_UI*/</script>
</body></html>
